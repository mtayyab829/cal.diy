databases:
  - name: cal-diy-db
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: cal-diy
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cal-diy-db
          property: connectionString
      - key: DATABASE_HOST
        fromDatabase:
          name: cal-diy-db
          property: host
      - key: NODE_ENV
        value: production
      - key: CALCOM_TELEMETRY_DISABLED
        value: "1"
      - key: NEXT_PUBLIC_LICENSE_CONSENT
        value: "agree"
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: CRON_API_KEY
        generateValue: true
      # Must be exactly 32 latin1 bytes for AES-256; Render's generateValue
      # produces a base64 string of unpredictable byte length.
      - key: CALENDSO_ENCRYPTION_KEY
        sync: false
      - key: NEXT_PUBLIC_WEBAPP_URL
        sync: false
      - key: NEXTAUTH_URL
        sync: false
